apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: dr-movies-service
spec:
  host: movies-service
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 2
      http:
        http1MaxPendingRequests: 1
        maxRequestsPerConnection: 1
    outlierDetection:
      consecutive5xxErrors: 1
      interval: 2s
      baseEjectionTime: 15s
      maxEjectionPercent: 100
